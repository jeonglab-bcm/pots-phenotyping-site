  # ---------------------------------------------------------------- treatment
  - id: volume_expansion_therapy
    group: treatment
    label: Volume expansion therapy
    definition: >
      Fludrocortisone, salt and fluid loading, desmopressin, and intravenous
      saline. Prescription implies a clinician's hypovolemic hypothesis.
    pubmed_query: 'fludrocortisone[tiab] OR "salt loading"[tiab] OR "sodium chloride"[tiab] OR "salt tablet*"[tiab] OR desmopressin[tiab] OR DDAVP[tiab] OR "intravenous saline"[tiab] OR "IV saline"[tiab] OR "IV fluid*"[tiab] OR "volume loading"[tiab] OR erythropoietin[tiab]'
    mesh_terms: ['Fludrocortisone', 'Deamino Arginine Vasopressin', 'Sodium Chloride', 'Fluid Therapy', 'Erythropoietin']
    concepts:
      - {vocabulary: RxNorm, search_term: 'fludrocortisone'}
      - {vocabulary: RxNorm, search_term: 'desmopressin'}
    source_refs: [lau2026, chung2026, angeli2024, low2009]

  - id: midodrine_therapy
    group: treatment
    label: Midodrine
    definition: >
      Alpha-1 agonist vasoconstrictor, used where venous pooling or neuropathic
      vasoconstrictor failure is suspected.
    pubmed_query: 'midodrine[tiab] OR "alpha-1 agonist"[tiab] OR "alpha agonist"[tiab] OR ProAmatine[tiab]'
    mesh_terms: ['Midodrine']
    concepts:
      - {vocabulary: RxNorm, search_term: 'midodrine'}
    source_refs: [lau2026, chung2026, angeli2024, low2009]

  - id: droxidopa_therapy
    group: treatment
    label: Droxidopa
    definition: >
      Noradrenaline prodrug used where a peripheral noradrenergic deficit is
      suspected.
    pubmed_query: 'droxidopa[tiab] OR L-DOPS[tiab] OR "L-threo-DOPS"[tiab] OR Northera[tiab]'
    mesh_terms: ['Droxidopa']
    concepts:
      - {vocabulary: RxNorm, search_term: 'droxidopa'}
    source_refs: [low2009]

  - id: ivabradine_therapy
    group: treatment
    label: Ivabradine
    definition: >
      Selective sinoatrial funny-current inhibitor, lowering heart rate without
      lowering blood pressure. Signals a rate-centred rather than volume-centred
      hypothesis.
    pubmed_query: 'ivabradine[tiab] OR "I(f) current"[tiab] OR "funny current"[tiab] OR "sinus node"[tiab] OR Corlanor[tiab]'
    mesh_terms: ['Ivabradine']
    concepts:
      - {vocabulary: RxNorm, search_term: 'ivabradine'}
    source_refs: [lau2026, chung2026, angeli2024]

  - id: beta_blocker_therapy
    group: treatment
    label: Beta blockade
    definition: >
      Propranolol, metoprolol, bisoprolol and related agents, most often given
      on a hyperadrenergic rationale.
    pubmed_query: '"beta blocker*"[tiab] OR "beta-blocker*"[tiab] OR "beta-adrenergic block*"[tiab] OR propranolol[tiab] OR metoprolol[tiab] OR bisoprolol[tiab] OR atenolol[tiab] OR nadolol[tiab] OR labetalol[tiab] OR carvedilol[tiab]'
    mesh_terms: ['Adrenergic beta-Antagonists', 'Propranolol', 'Metoprolol', 'Bisoprolol', 'Atenolol']
    concepts:
      - {vocabulary: RxNorm, search_term: 'propranolol'}
      - {vocabulary: RxNorm, search_term: 'metoprolol'}
    source_refs: [lau2026, chung2026, angeli2024, low2009]

  - id: pyridostigmine_therapy
    group: treatment
    label: Pyridostigmine
    definition: >
      Peripheral acetylcholinesterase inhibitor enhancing ganglionic
      transmission, used on a neuropathic or autoimmune rationale.
    pubmed_query: 'pyridostigmine[tiab] OR "acetylcholinesterase inhibitor"[tiab] OR "cholinesterase inhibitor"[tiab] OR Mestinon[tiab]'
    mesh_terms: ['Pyridostigmine Bromide', 'Cholinesterase Inhibitors']
    concepts:
      - {vocabulary: RxNorm, search_term: 'pyridostigmine'}
    source_refs: [lau2026, chung2026, angeli2024, low2009]

  - id: central_sympatholytic_therapy
    group: treatment
    label: Central sympatholytics
    definition: >
      Clonidine, guanfacine and methyldopa, alpha-2 agonists that lower central
      sympathetic tone; used mainly for a hyperadrenergic presentation.
    pubmed_query: 'clonidine[tiab] OR methyldopa[tiab] OR guanfacine[tiab] OR "central sympatholytic"[tiab] OR "alpha-2 agonist"[tiab]'
    mesh_terms: ['Clonidine', 'Methyldopa', 'Guanfacine', 'Sympatholytics']
    concepts:
      - {vocabulary: RxNorm, search_term: 'clonidine'}
      - {vocabulary: RxNorm, search_term: 'methyldopa'}
    source_refs: [lau2026, chung2026, low2009]

  - id: immunomodulatory_therapy
    group: treatment
    label: Immunomodulation
    definition: >
      Intravenous immunoglobulin, rituximab, plasma exchange and corticosteroids
      given for a presumed autoimmune mechanism.
    pubmed_query: '"intravenous immunoglobulin"[tiab] OR IVIG[tiab] OR IVIg[tiab] OR rituximab[tiab] OR "plasma exchange"[tiab] OR plasmapheresis[tiab] OR "immunoadsorption"[tiab] OR immunosuppress*[tiab] OR immunomodulat*[tiab] OR corticosteroid*[tiab]'
    mesh_terms: ['Immunoglobulins, Intravenous', 'Rituximab', 'Plasma Exchange', 'Immunomodulating Agents', 'Immunosuppressive Agents']
    concepts:
      - {vocabulary: RxNorm, search_term: 'immune globulin'}
      - {vocabulary: RxNorm, search_term: 'rituximab'}
    source_refs: [lau2026]

  - id: exercise_reconditioning
    group: treatment
    label: Exercise reconditioning
    definition: >
      Structured recumbent-to-upright exercise programmes such as the Levine and
      CHOP protocols, prescribed against a deconditioning hypothesis.
    pubmed_query: '"exercise training"[tiab] OR "exercise program*"[tiab] OR reconditioning[tiab] OR rehabilitation[tiab] OR "recumbent"[tiab] OR "Levine protocol"[tiab] OR "CHOP protocol"[tiab] OR "physical therapy"[tiab] OR "aerobic training"[tiab]'
    mesh_terms: ['Exercise Therapy', 'Exercise', 'Physical Therapy Modalities', 'Rehabilitation']
    concepts:
      - {vocabulary: SNOMED, search_term: 'exercise therapy'}
      - {vocabulary: SNOMED, search_term: 'cardiac rehabilitation'}
    source_refs: [lau2026, chung2026, angeli2024, low2009, gibbons2013]

  - id: compression_therapy
    group: treatment
    label: Compression garments
    definition: >
      Abdominal binders and lower-limb compression that mechanically oppose
      venous pooling, targeting the neuropathic and hypovolemic flags.
    pubmed_query: 'compression[tiab] OR "compression stocking*"[tiab] OR "abdominal binder"[tiab] OR "abdominal compression"[tiab] OR "waist-high"[tiab] OR "counter-manoeuvre*"[tiab] OR "countermaneuver*"[tiab]'
    mesh_terms: ['Stockings, Compression', 'Compression Bandages']
    concepts:
      - {vocabulary: SNOMED, search_term: 'compression stockings'}
    source_refs: [lau2026, chung2026, angeli2024, low2009]

  - id: serotonergic_therapy
    group: treatment
    label: Serotonergic and other central agents
    definition: >
      Serotonin reuptake inhibitors, serotonin-noradrenaline reuptake
      inhibitors and modafinil. Low specificity: these are mostly prescribed for
      coexisting depression, anxiety or fatigue, and SNRIs can worsen
      orthostatic tachycardia (Lau 2026, Chung 2026).
    pubmed_query: 'SSRI[tiab] OR SNRI[tiab] OR fluoxetine[tiab] OR sertraline[tiab] OR venlafaxine[tiab] OR duloxetine[tiab] OR modafinil[tiab] OR "serotonin reuptake"[tiab] OR "tricyclic"[tiab]'
    mesh_terms: ['Selective Serotonin Reuptake Inhibitors', 'Modafinil', 'Serotonin and Noradrenaline Reuptake Inhibitors']
    concepts:
      - {vocabulary: RxNorm, search_term: 'sertraline'}
      - {vocabulary: RxNorm, search_term: 'venlafaxine'}
    source_refs: [chung2026]

# Seed references, used by the validation report to check that the corpus
# actually contains the papers the vocabulary was built from.
# Resolution is by title match, not by taking esearch's first hit: PubMed treats
# an unquoted [Title] search as a bag of words ordered by relevance, so the first
# hit for a title query is regularly a different paper. expected_pmid is checked
# independently against the corpus, so a drifting lookup query is detected
# without the check becoming circular.
  - id: physical_countermaneuvers
    group: treatment
    label: Physical countermaneuvers
    definition: >
      Leg crossing, muscle tensing, squatting and similar manoeuvres that push
      blood back from the legs on standing.
    pubmed_query: 'countermaneuver*[tiab] OR "counter-maneuver*"[tiab] OR "counter maneuver*"[tiab] OR "physical counterpressure"[tiab] OR "leg crossing"[tiab] OR "muscle tensing"[tiab]'
    mesh_terms: ['Exercise Therapy']
    concepts:
      - {vocabulary: SNOMED, search_term: 'isometric exercise'}
    source_refs: [chung2026, angeli2024, low2009]
  - id: lifestyle_modification
    group: treatment
    label: Behavioural and dietary measures
    definition: >
      Avoiding heat, prolonged standing, alcohol and large carbohydrate-rich
      meals; small frequent meals; head-up sleeping and similar measures.
    pubmed_query: '"lifestyle"[tiab] OR "small meals"[tiab] OR "avoid heat"[tiab] OR "head-up sleeping"[tiab] OR "dietary modification"[tiab] OR "behavioral modification"[tiab]'
    mesh_terms: ['Life Style', 'Health Behavior']
    concepts:
      - {vocabulary: SNOMED, search_term: 'lifestyle education'}
    source_refs: [chung2026]
  - id: offending_medication_withdrawal
    group: treatment
    label: Stopping drugs that worsen POTS
    definition: Withdrawing or replacing medications that worsen orthostatic tachycardia.
    pubmed_query: '"deprescribing"[tiab] OR "medication review"[tiab] OR "drug withdrawal"[tiab] OR "medication withdrawal"[tiab]'
    mesh_terms: ['Deprescriptions', 'Withholding Treatment']
    concepts:
      - {vocabulary: SNOMED, search_term: 'medication review'}
    source_refs: [chung2026]
  - id: auricular_vagus_nerve_stimulation
    group: treatment
    label: Auricular vagus nerve stimulation
    definition: Non-invasive stimulation of the auricular branch of the vagus nerve.
    pubmed_query: '"vagus nerve stimulation"[tiab] OR "vagal nerve stimulation"[tiab] OR tVNS[tiab] OR taVNS[tiab] OR "auricular stimulation"[tiab]'
    mesh_terms: ['Vagus Nerve Stimulation', 'Transcutaneous Electric Nerve Stimulation']
    concepts:
      - {vocabulary: SNOMED, search_term: 'vagus nerve stimulation'}
    source_refs: [lau2026]
  - id: antihistamine_therapy
    group: treatment
    label: Antihistamines and mast cell stabilisers
    definition: H1 and H2 antihistamines and mast cell stabilisers, used when mast cell activation is suspected.
    pubmed_query: 'antihistamine*[tiab] OR "H1 blocker*"[tiab] OR "H2 blocker*"[tiab] OR famotidine[tiab] OR cetirizine[tiab] OR "cromolyn"[tiab] OR "mast cell stabili*"[tiab]'
    mesh_terms: ['Histamine Antagonists', 'Histamine H1 Antagonists', 'Histamine H2 Antagonists', 'Cromolyn Sodium']
    concepts:
      - {vocabulary: RxNorm, search_term: 'cetirizine'}
      - {vocabulary: RxNorm, search_term: 'famotidine'}
    source_refs: [lau2026]
  - id: prokinetic_therapy
    group: treatment
    label: Prokinetic agents
    definition: Drugs that promote gastrointestinal motility, used for gut dysmotility in POTS.
    pubmed_query: 'prokinetic*[tiab] OR metoclopramide[tiab] OR domperidone[tiab] OR prucalopride[tiab] OR erythromycin[tiab]'
    mesh_terms: ['Gastrointestinal Agents', 'Metoclopramide', 'Domperidone']
    concepts:
      - {vocabulary: RxNorm, search_term: 'metoclopramide'}
    source_refs: [lau2026]
  - id: phenobarbital_therapy
    group: treatment
    label: Phenobarbital
    definition: Low-dose phenobarbital, used by Low 2009 for unstable hypertensive tilt responses.
    pubmed_query: 'phenobarbital[tiab] OR phenobarbitone[tiab] OR barbiturate*[tiab]'
    mesh_terms: ['Phenobarbital']
    concepts:
      - {vocabulary: RxNorm, search_term: 'phenobarbital'}
    source_refs: [low2009]


