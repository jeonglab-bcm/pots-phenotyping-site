  - id: chronic_migraine
    group: comorbidity
    label: Migraine and chronic headache
    definition: >
      Migraine, chronic daily headache and their overlap with orthostatic
      headache from cerebral hypoperfusion or cerebrospinal fluid leak.
    pubmed_query: 'migraine[tiab] OR headache*[tiab] OR "orthostatic headache"[tiab] OR "cerebrospinal fluid leak"[tiab] OR "intracranial hypotension"[tiab]'
    mesh_terms: ['Migraine Disorders', 'Headache', 'Intracranial Hypotension']
    concepts:
      - {vocabulary: SNOMED, search_term: 'migraine'}
    source_refs: [lau2026, chung2026, angeli2024, low2009, zhang2022]

  - id: differential_syncope_oh
    group: comorbidity
    label: Competing orthostatic diagnoses
    definition: >
      Orthostatic hypotension, vasovagal and other reflex syncope, pure
      autonomic failure and multiple system atrophy. The absence of orthostatic
      hypotension is part of the POTS definition, so a computable phenotype
      needs these explicitly. Other causes of sinus tachycardia and arrhythmias
      are separate facets.
    pubmed_query: '"vasovagal"[tiab] OR "orthostatic hypotension"[tiab] OR "pure autonomic failure"[tiab] OR "multiple system atrophy"[tiab] OR "neurally mediated syncope"[tiab] OR "reflex syncope"[tiab]'
    mesh_terms: ['Syncope, Vasovagal', 'Hypotension, Orthostatic', 'Pure Autonomic Failure', 'Multiple System Atrophy']
    concepts:
      - {vocabulary: SNOMED, search_term: 'vasovagal syncope'}
      - {vocabulary: SNOMED, search_term: 'orthostatic hypotension'}
      - {vocabulary: SNOMED, search_term: 'inappropriate sinus tachycardia'}
    source_refs: [lau2026, chung2026, angeli2024, low2009, zhang2022]


  - id: secondary_sinus_tachycardia
    group: comorbidity
    label: Other causes of sinus tachycardia (rule out)
    definition: >
      Conditions that raise heart rate and must be excluded before POTS is
      diagnosed: anaemia, dehydration, infection, hyperthyroidism, adrenal
      insufficiency, pheochromocytoma, pain, anorexia nervosa and other
      transient states.
    pubmed_query: 'anemia[tiab] OR anaemia[tiab] OR dehydration[tiab] OR hyperthyroidism[tiab] OR thyrotoxicosis[tiab] OR pheochromocytoma[tiab] OR "adrenal insufficiency"[tiab] OR "anorexia nervosa"[tiab]'
    mesh_terms: ['Anemia', 'Dehydration', 'Hyperthyroidism', 'Pheochromocytoma', 'Adrenal Insufficiency', 'Anorexia Nervosa']
    concepts:
      - {vocabulary: SNOMED, search_term: 'anemia'}
      - {vocabulary: SNOMED, search_term: 'hyperthyroidism'}
      - {vocabulary: SNOMED, search_term: 'pheochromocytoma'}
    source_refs: [lau2026, chung2026, gibbons2013]
  - id: arrhythmia_differential
    group: comorbidity
    label: Arrhythmias and inappropriate sinus tachycardia (rule out)
    definition: >
      Supraventricular tachycardias and inappropriate sinus tachycardia, which
      can resemble POTS and are excluded with ECG, Holter or electrophysiology.
    pubmed_query: '"supraventricular tachycardia"[tiab] OR "inappropriate sinus tachycardia"[tiab] OR "atrial tachycardia"[tiab] OR "sinus node reentr*"[tiab] OR arrhythmia[tiab]'
    mesh_terms: ['Tachycardia, Supraventricular', 'Tachycardia, Sinus', 'Arrhythmias, Cardiac']
    concepts:
      - {vocabulary: SNOMED, search_term: 'supraventricular tachycardia'}
      - {vocabulary: SNOMED, search_term: 'inappropriate sinus tachycardia'}
    source_refs: [chung2026, low2009]
  - id: structural_cardiopulmonary_disease
    group: comorbidity
    label: Structural heart and chronic lung disease (rule out)
    definition: >
      Cardiomyopathy, valvular and congenital heart disease, and chronic lung
      disease, which must be excluded as causes of tachycardia and dyspnoea.
    pubmed_query: 'cardiomyopathy[tiab] OR "valvular heart disease"[tiab] OR "congenital heart disease"[tiab] OR "structural heart"[tiab] OR "chronic lung disease"[tiab] OR COPD[tiab]'
    mesh_terms: ['Cardiomyopathies', 'Heart Valve Diseases', 'Heart Defects, Congenital', 'Lung Diseases']
    concepts:
