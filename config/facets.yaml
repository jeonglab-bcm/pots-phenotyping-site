# POTS deep-phenotyping facet vocabulary.
#
# A facet is a labelled axis of evidence, NOT a mutually exclusive subtype.
# Angeli et al. (Sci Rep 2024) classified 352 patients and found 42% met two
# mechanistic definitions and 11% met all three; symptoms alone did not separate
# them. The vocabulary is therefore built as overlapping evidence flags that a
# patient (or a paper) can carry in any combination.
#
# Every facet carries:
#   pubmed_query  - AND-ed with the corpus query to tag which papers discuss it.
#   mesh_terms    - descriptor names for a second, indexing-based tag path.
#   concepts      - search terms handed to the OMOP concept resolver. These are
#                   SEARCH TERMS, not asserted codes: no concept_id or code is
#                   hand-written in this repo. The resolver looks them up and
#                   records provenance, and every mapping lands as
#                   mapping_status='unreviewed' until a human signs it off.
#                   fallback_gap: true marks a term that is correct against full
#                   SNOMED but that the public fallback service cannot resolve,
#                   because the EBI Ontology Lookup Service carries only a subset
#                   of SNOMED. Such a term is kept deliberately: it is the right
#                   thing to look up once an ATHENA bundle is available, and the
#                   validation report lists it as a known fallback gap rather
#                   than as a vocabulary error.
#
# groups: mechanism | measurement | comorbidity | treatment

groups:
  mechanism:
    label: Mechanistic evidence flag
    definition: >
      A pathophysiological process proposed to produce or sustain orthostatic
      tachycardia. These are the flags intended to become OMOP-computable
      phenotype outputs.
  measurement:
    label: Objective test or measurement
    definition: >
      A procedure or laboratory measurement that supplies objective evidence for
      one or more mechanism flags. These are what an OMOP phenotype can actually
      observe, in the Measurement and Procedure domains.
  comorbidity:
    label: Comorbidity, etiology or differential
    definition: >
      A co-occurring condition, a triggering exposure, or a competing diagnosis
      that changes the interpretation of a mechanism flag.
  treatment:
    label: Treatment whose use implies a phenotype
    definition: >
      An intervention whose prescription is itself weak evidence of a clinician's
      mechanistic hypothesis, usable as a Drug- or Procedure-domain proxy.

facets:

  # ---------------------------------------------------------------- mechanism
  - id: hyperadrenergic_evidence
    group: mechanism
    label: Hyperadrenergic evidence
    definition: >
      Excess sympathetic outflow or impaired noradrenaline clearance: upright
      plasma noradrenaline elevation, marked orthostatic hypertension, tremor and
      cold sweaty extremities, or a noradrenaline transporter deficiency.
    pubmed_query: 'hyperadrenergic[tiab] OR "hyper-adrenergic"[tiab] OR ("norepinephrine"[tiab] OR "noradrenaline"[tiab] OR catecholamine*[tiab] OR "sympathetic activation"[tiab] OR "sympathetic overactivity"[tiab] OR "muscle sympathetic nerve activity"[tiab] OR "norepinephrine transporter"[tiab] OR SLC6A2[tiab])'
    mesh_terms: ['Norepinephrine', 'Catecholamines', 'Sympathetic Nervous System', 'Epinephrine', 'Norepinephrine Plasma Membrane Transport Proteins']
    concepts:
      - {vocabulary: SNOMED, search_term: 'increased sympathetic activity', fallback_gap: true}
      - {vocabulary: SNOMED, search_term: 'orthostatic hypertension', fallback_gap: true}
      - {vocabulary: SNOMED, search_term: 'standing blood pressure'}
      - {vocabulary: LOINC,  search_term: 'norepinephrine plasma'}
      - {vocabulary: LOINC,  search_term: 'norepinephrine standing'}
    source_refs: [lau2026, chung2026, angeli2024, low2009, gibbons2013, zhang2022, larsen2025]

  - id: neuropathic_evidence
    group: mechanism
    label: Neuropathic evidence
    definition: >
      Peripheral autonomic denervation: a small-fibre and sudomotor deficit,
      often patchy rather than length-dependent, that impairs lower-limb
      vasoconstriction and lets blood pool in the legs.
    pubmed_query: '"small fiber"[tiab] OR "small-fibre"[tiab] OR "small fibre"[tiab] OR neuropathic[tiab] OR neuropathy[tiab] OR denervation[tiab] OR "sudomotor"[tiab] OR "nerve fiber density"[tiab] OR "nerve fibre density"[tiab] OR "venous pooling"[tiab] OR "acral"[tiab]'
    mesh_terms: ['Peripheral Nervous System Diseases', 'Small Fiber Neuropathy', 'Sweat Glands', 'Nerve Fibers, Unmyelinated', 'Autonomic Nervous System Diseases']
    concepts:
      - {vocabulary: SNOMED, search_term: 'small fibre neuropathy'}
      - {vocabulary: SNOMED, search_term: 'autonomic neuropathy'}
      - {vocabulary: SNOMED, search_term: 'anhidrosis'}
    source_refs: [lau2026, chung2026, angeli2024, low2009, gibbons2013, zhang2022, larsen2025]

  - id: hypovolemic_evidence
    group: mechanism
    label: Hypovolemic evidence
    definition: >
      Reduced plasma or red-cell volume, frequently with a paradoxically low
      plasma renin activity and aldosterone for the degree of volume depletion.
    pubmed_query: 'hypovolemi*[tiab] OR hypovolaemi*[tiab] OR "plasma volume"[tiab] OR "blood volume"[tiab] OR "red cell volume"[tiab] OR "renin"[tiab] OR "aldosterone"[tiab] OR "angiotensin"[tiab] OR "volume depletion"[tiab] OR "volume expansion"[tiab]'
    mesh_terms: ['Hypovolemia', 'Plasma Volume', 'Blood Volume', 'Renin', 'Aldosterone', 'Renin-Angiotensin System']
    concepts:
      - {vocabulary: SNOMED, search_term: 'hypovolaemia'}
      - {vocabulary: LOINC,  search_term: 'plasma volume'}
      - {vocabulary: LOINC,  search_term: 'renin activity plasma'}
    source_refs: [lau2026, chung2026, angeli2024, low2009, gibbons2013, zhang2022]

  - id: deconditioning_evidence
    group: mechanism
    label: Deconditioning evidence
    definition: >
      Reduced cardiac mass and stroke volume with low peak oxygen uptake, whether
      as primary cause or as a secondary consequence of activity avoidance. Its
      causal direction is contested, which is exactly why it is a flag and not a
      subtype.
    pubmed_query: 'deconditioning[tiab] OR deconditioned[tiab] OR "physical inactivity"[tiab] OR "bed rest"[tiab] OR "exercise capacity"[tiab] OR "peak oxygen"[tiab] OR VO2[tiab] OR "cardiac atrophy"[tiab] OR "stroke volume"[tiab] OR "cardiac mass"[tiab]'
    mesh_terms: ['Bed Rest', 'Exercise Tolerance', 'Oxygen Consumption', 'Cardiomegaly', 'Sedentary Behavior', 'Stroke Volume']
    concepts:
      - {vocabulary: SNOMED, search_term: 'physical deconditioning'}
      - {vocabulary: LOINC,  search_term: 'oxygen consumption'}
    source_refs: [lau2026, chung2026, low2009, gibbons2013]

  - id: autoimmune_evidence
    group: mechanism
    label: Autoimmune evidence
    definition: >
      Autoantibodies against autonomic targets (ganglionic acetylcholine
      receptor, adrenergic and muscarinic receptors) or a coexisting systemic
      autoimmune disease.
    pubmed_query: 'autoimmun*[tiab] OR autoantibod*[tiab] OR "antibodies"[tiab] OR "acetylcholine receptor"[tiab] OR "adrenergic receptor antibod*"[tiab] OR "muscarinic receptor antibod*"[tiab] OR "ganglionic"[tiab] OR immunotherapy[tiab] OR "molecular mimicry"[tiab]'
    mesh_terms: ['Autoantibodies', 'Autoimmune Diseases', 'Autoimmunity', 'Receptors, Adrenergic', 'Receptors, Muscarinic', 'Receptors, Nicotinic']
    concepts:
      - {vocabulary: SNOMED, search_term: 'autoimmune autonomic ganglionopathy', fallback_gap: true}
      - {vocabulary: SNOMED, search_term: 'autonomic ganglionopathy'}
      - {vocabulary: SNOMED, search_term: 'autoimmune disorder of autonomic nervous system'}
      - {vocabulary: LOINC,  search_term: 'acetylcholine receptor ganglionic antibody'}
    source_refs: [lau2026, chung2026, low2009, gibbons2013, zhang2022]

  - id: postinfectious_evidence
    group: mechanism
    label: Post-infectious evidence
    definition: >
      Symptom onset temporally linked to an infection, including SARS-CoV-2,
      Epstein-Barr virus, influenza and Lyme disease.
    pubmed_query: 'post-infectious[tiab] OR postinfectious[tiab] OR "post infectious"[tiab] OR postviral[tiab] OR "post-viral"[tiab] OR COVID*[tiab] OR "SARS-CoV-2"[tiab] OR "Epstein-Barr"[tiab] OR mononucleosis[tiab] OR influenza[tiab] OR "Lyme"[tiab] OR sepsis[tiab] OR "viral illness"[tiab]'
    mesh_terms: ['COVID-19', 'SARS-CoV-2', 'Post-Acute COVID-19 Syndrome', 'Epstein-Barr Virus Infections', 'Virus Diseases', 'Lyme Disease']
    concepts:
      - {vocabulary: SNOMED, search_term: 'post-viral syndrome', fallback_gap: true}
      - {vocabulary: SNOMED, search_term: 'Postviral fatigue syndrome'}
      - {vocabulary: SNOMED, search_term: 'Chronic post-COVID-19 syndrome'}
    source_refs: [lau2026, chung2026, low2009, gibbons2013, larsen2025]


  - id: cerebral_hypoperfusion_evidence
    group: mechanism
    label: Cerebral hypoperfusion evidence
    definition: >
      Reduced cerebral blood flow on standing, often with orthostatic
      hyperventilation and hypocapnia that further constrict cerebral vessels,
      proposed as a driver of brain fog and of the orthostatic symptoms. Named as
      a proposed mechanism by Chung 2026 and Lau 2026; Larsen 2025 found
      cerebrovascular measures did not correlate with symptoms.
    pubmed_query: '"cerebral hypoperfusion"[tiab] OR "cerebral blood flow"[tiab] OR "cerebral perfusion"[tiab] OR "cerebrovascular"[tiab] OR hypocapnia[tiab] OR hypocapnic[tiab] OR "orthostatic hyperventilation"[tiab] OR "end-tidal CO2"[tiab] OR "brain fog"[tiab]'
    mesh_terms: ['Cerebrovascular Circulation', 'Hypocapnia', 'Hyperventilation', 'Cognitive Dysfunction']
    concepts:
      - {vocabulary: SNOMED, search_term: 'cerebral hypoperfusion'}
      - {vocabulary: SNOMED, search_term: 'hypocapnia'}
    source_refs: [chung2026]

  # -------------------------------------------------------------- measurement
  - id: head_up_tilt_test
    group: measurement
    label: Head-up tilt table test
    definition: >
      Passive 60-70 degree head-up tilt with continuous heart rate and blood
      pressure. Supplies the diagnostic heart-rate increment itself.
    pubmed_query: '"tilt table"[tiab] OR "tilt-table"[tiab] OR "head-up tilt"[tiab] OR "head up tilt"[tiab] OR HUTT[tiab] OR "tilt testing"[tiab] OR "orthostatic challenge"[tiab]'
    mesh_terms: ['Tilt-Table Test']
    concepts:
      - {vocabulary: SNOMED, search_term: 'tilt table test'}
      - {vocabulary: LOINC,  search_term: 'tilt table study'}
    source_refs: [lau2026, chung2026, angeli2024, low2009, gibbons2013, zhang2022, larsen2025]

  - id: active_stand_test
    group: measurement
    label: Active stand test
    definition: >
      Ten-minute active standing with serial heart rate and blood pressure, the
      pragmatic clinic alternative to tilt. Yields a different heart-rate
      increment than tilt, which matters for phenotype threshold portability.
    pubmed_query: '"active stand"[tiab] OR "standing test"[tiab] OR "stand test"[tiab] OR "10-minute stand"[tiab] OR "orthostatic vital signs"[tiab] OR "NASA lean test"[tiab]'
    mesh_terms: ['Standing Position', 'Posture']
    concepts:
      - {vocabulary: SNOMED, search_term: 'measurement of orthostatic blood pressure'}
      - {vocabulary: SNOMED, search_term: 'standing blood pressure'}
      - {vocabulary: LOINC,  search_term: 'heart rate standing'}
    source_refs: [lau2026, chung2026, angeli2024]

  - id: qsart_sudomotor_testing
    group: measurement
    label: QSART and sudomotor testing
    definition: >
      Quantitative sudomotor axon reflex test and related sympathetic sweat
      measures. Zhang et al. found reduced sweat output in about a third of 356
      patients tested.
    pubmed_query: 'QSART[tiab] OR "quantitative sudomotor"[tiab] OR "sudomotor axon reflex"[tiab] OR "sweat output"[tiab] OR "sympathetic skin response"[tiab] OR sudoscan[tiab] OR "electrochemical skin conductance"[tiab] OR "silastic sweat imprint"[tiab]'
    mesh_terms: ['Sweating', 'Galvanic Skin Response', 'Sweat Glands']
    concepts:
      - {vocabulary: SNOMED, search_term: 'quantitative sudomotor axon reflex test', fallback_gap: true}
      - {vocabulary: SNOMED, search_term: 'sweat test'}
      - {vocabulary: SNOMED, search_term: 'sweat measure'}
    source_refs: [chung2026, angeli2024, low2009, gibbons2013, zhang2022, larsen2025]

  - id: thermoregulatory_sweat_test
    group: measurement
    label: Thermoregulatory sweat test
    definition: >
      Whole-body sweat distribution under controlled heating, localising
      anhidrosis and distinguishing pre- from post-ganglionic lesions when read
      against QSART.
    pubmed_query: '"thermoregulatory sweat test"[tiab] OR TST[tiab] OR anhidrosis[tiab] OR hypohidrosis[tiab] OR "sweat distribution"[tiab]'
    mesh_terms: ['Hypohidrosis', 'Body Temperature Regulation']
    concepts:
      - {vocabulary: SNOMED, search_term: 'thermoregulatory sweat test', fallback_gap: true}
      - {vocabulary: SNOMED, search_term: 'sweat measure'}
      - {vocabulary: SNOMED, search_term: 'sweat test'}
    source_refs: [angeli2024, low2009]

  - id: skin_biopsy_ienfd
    group: measurement
    label: Skin biopsy and intraepidermal nerve fibre density
    definition: >
      Punch biopsy with PGP 9.5 immunostaining and nerve-fibre density
      quantification, the structural counterpart to sudomotor testing. Reduced
      density is reported in about 24% (Zhang 2022) to 45-53% (Chung 2026) of
      patients biopsied.
    pubmed_query: '"skin biopsy"[tiab] OR "punch biopsy"[tiab] OR "intraepidermal nerve fiber"[tiab] OR "intraepidermal nerve fibre"[tiab] OR IENFD[tiab] OR "nerve fiber density"[tiab] OR "PGP 9.5"[tiab] OR "PGP9.5"[tiab] OR "sweat gland nerve fiber density"[tiab]'
    mesh_terms: ['Biopsy', 'Skin', 'Nerve Fibers', 'Ubiquitin Thiolesterase']
    concepts:
      - {vocabulary: SNOMED, search_term: 'skin biopsy'}
      - {vocabulary: SNOMED, search_term: 'punch biopsy of skin'}
    source_refs: [chung2026, angeli2024, gibbons2013, zhang2022, larsen2025]

  - id: plasma_catecholamine_assay
    group: measurement
    label: Supine and upright plasma catecholamines
    definition: >
      Paired supine and standing noradrenaline and adrenaline. An upright
      noradrenaline above roughly 600 pg/mL is the most-cited hyperadrenergic
      criterion, and the paired design is what makes it interpretable.
    pubmed_query: '"plasma norepinephrine"[tiab] OR "plasma noradrenaline"[tiab] OR "plasma catecholamine*"[tiab] OR "upright norepinephrine"[tiab] OR "standing norepinephrine"[tiab] OR "supine norepinephrine"[tiab] OR "24-hour urinary catecholamine*"[tiab] OR metanephrine*[tiab]'
    mesh_terms: ['Norepinephrine', 'Catecholamines', 'Epinephrine', 'Metanephrine']
    concepts:
      - {vocabulary: LOINC, search_term: 'norepinephrine plasma'}
      - {vocabulary: LOINC, search_term: 'epinephrine plasma'}
      - {vocabulary: LOINC, search_term: 'metanephrine plasma'}
    source_refs: [chung2026, angeli2024, low2009, larsen2025]

  - id: plasma_blood_volume_assay
    group: measurement
    label: Plasma and blood volume measurement
    definition: >
      Direct volume quantification by carbon monoxide rebreathing, indocyanine
      green, or iodinated-albumin dilution. The only way to make the hypovolemic
      flag objective rather than inferred.
    pubmed_query: '"plasma volume"[tiab] OR "blood volume"[tiab] OR "red cell mass"[tiab] OR "carbon monoxide rebreathing"[tiab] OR "indocyanine green"[tiab] OR "iodinated albumin"[tiab] OR "volume status"[tiab] OR hematocrit[tiab]'
    mesh_terms: ['Plasma Volume', 'Blood Volume Determination', 'Blood Volume', 'Hematocrit']
    concepts:
      - {vocabulary: LOINC, search_term: 'plasma volume'}
      - {vocabulary: LOINC, search_term: 'blood volume'}
      - {vocabulary: LOINC, search_term: 'hematocrit'}
    source_refs: [chung2026]

  - id: cerebral_blood_flow_measurement
    group: measurement
    label: Cerebral blood flow velocity
    definition: >
      Transcranial Doppler middle-cerebral-artery velocity, near-infrared
      spectroscopy, or cerebral oximetry during orthostasis. Explains symptoms
      that the heart-rate criterion does not.
    pubmed_query: '"cerebral blood flow"[tiab] OR "transcranial Doppler"[tiab] OR "middle cerebral artery"[tiab] OR "cerebral oximetry"[tiab] OR "near-infrared spectroscopy"[tiab] OR "cerebral autoregulation"[tiab] OR "cerebral perfusion"[tiab] OR "cerebral hypoperfusion"[tiab]'
    mesh_terms: ['Cerebrovascular Circulation', 'Ultrasonography, Doppler, Transcranial', 'Spectroscopy, Near-Infrared', 'Middle Cerebral Artery']
    concepts:
      - {vocabulary: SNOMED, search_term: 'transcranial Doppler ultrasonography'}
      - {vocabulary: SNOMED, search_term: 'cerebral blood flow'}
    source_refs: [chung2026, larsen2025]

  - id: heart_rate_variability
    group: measurement
    label: Heart rate variability and baroreflex sensitivity
    definition: >
      Spectral and time-domain heart-rate variability, deep-breathing
      respiratory sinus arrhythmia, and baroreflex gain: the cardiovagal side of
      autonomic testing.
    pubmed_query: '"heart rate variability"[tiab] OR HRV[tiab] OR baroreflex[tiab] OR "baroreceptor"[tiab] OR "deep breathing"[tiab] OR "respiratory sinus arrhythmia"[tiab] OR "vagal tone"[tiab] OR "cardiovagal"[tiab] OR "spectral analysis"[tiab]'
    mesh_terms: ['Heart Rate', 'Baroreflex', 'Vagus Nerve', 'Autonomic Nervous System']
    concepts:
      - {vocabulary: SNOMED, search_term: 'heart rate variability'}
      - {vocabulary: LOINC,  search_term: 'heart rate'}
    source_refs: [chung2026, angeli2024, gibbons2013, zhang2022, larsen2025]

  - id: valsalva_maneuver
    group: measurement
    label: Valsalva manoeuvre
    definition: >
      Valsalva ratio and phase II/IV blood-pressure response, separating
      adrenergic from cardiovagal failure. Part of the standard autonomic reflex
      screen alongside deep breathing and QSART.
    pubmed_query: 'Valsalva[tiab] OR "Valsalva ratio"[tiab] OR "adrenergic baroreflex"[tiab] OR "phase IV"[tiab] OR "composite autonomic severity"[tiab] OR CASS[tiab] OR "autonomic reflex screen"[tiab]'
    mesh_terms: ['Valsalva Maneuver', 'Blood Pressure']
    concepts:
      - {vocabulary: SNOMED, search_term: 'Valsalva manoeuvre'}
      - {vocabulary: SNOMED, search_term: 'autonomic function studies'}
    source_refs: [chung2026, low2009, gibbons2013, zhang2022, larsen2025]

  - id: cardiopulmonary_exercise_test
    group: measurement
    label: Cardiopulmonary exercise testing
    definition: >
      Peak oxygen uptake, chronotropic response and ventilatory efficiency, the
      objective substrate for the deconditioning flag and for post-exertional
      malaise phenotyping.
    pubmed_query: '"cardiopulmonary exercise"[tiab] OR CPET[tiab] OR "exercise testing"[tiab] OR "peak VO2"[tiab] OR "VO2 max"[tiab] OR "maximal oxygen uptake"[tiab] OR "anaerobic threshold"[tiab] OR "2-day CPET"[tiab] OR "invasive cardiopulmonary"[tiab]'
    mesh_terms: ['Exercise Test', 'Oxygen Consumption', 'Exercise Tolerance']
    concepts:
      - {vocabulary: SNOMED, search_term: 'cardiopulmonary exercise test'}
      - {vocabulary: LOINC,  search_term: 'oxygen consumption'}
    source_refs: [lau2026, chung2026, low2009]

  - id: autonomic_autoantibody_assay
    group: measurement
    label: Autonomic autoantibody assay
    definition: >
      Ganglionic acetylcholine receptor antibody, and adrenergic and muscarinic
      receptor antibody panels including functional cell-based assays.
    pubmed_query: '"ganglionic acetylcholine receptor"[tiab] OR "alpha-1 adrenergic receptor antibod*"[tiab] OR "beta-1 adrenergic receptor antibod*"[tiab] OR "beta-2 adrenergic"[tiab] OR "muscarinic acetylcholine receptor antibod*"[tiab] OR "angiotensin II type 1 receptor antibod*"[tiab] OR "functional autoantibod*"[tiab] OR "G-protein coupled receptor autoantibod*"[tiab]'
    mesh_terms: ['Autoantibodies', 'Receptors, Nicotinic', 'Receptors, Adrenergic, beta-1', 'Receptors, Muscarinic']
    concepts:
      - {vocabulary: LOINC,  search_term: 'acetylcholine receptor antibody'}
      - {vocabulary: SNOMED, search_term: 'autoantibody measurement'}
    source_refs: [lau2026, chung2026, low2009, zhang2022]

  - id: ambulatory_monitoring
    group: measurement
    label: Ambulatory heart rate and blood pressure monitoring
    definition: >
      Holter, patch electrocardiography, wearable heart-rate and 24-hour
      ambulatory blood pressure. The realistic source of a heart-rate criterion
      in routine electronic health record data, as opposed to a formal lab.
    pubmed_query: 'Holter[tiab] OR "ambulatory blood pressure"[tiab] OR "ambulatory monitoring"[tiab] OR "wearable"[tiab] OR "24-hour heart rate"[tiab] OR actigraphy[tiab] OR "implantable loop"[tiab] OR "patch monitor"[tiab]'
    mesh_terms: ['Electrocardiography, Ambulatory', 'Blood Pressure Monitoring, Ambulatory', 'Wearable Electronic Devices', 'Actigraphy']
    concepts:
      - {vocabulary: SNOMED, search_term: 'ambulatory electrocardiographic monitoring'}
      - {vocabulary: SNOMED, search_term: 'electrocardiographic monitoring'}
      - {vocabulary: SNOMED, search_term: 'ambulatory blood pressure monitoring'}
    source_refs: [lau2026, chung2026, low2009]

  - id: genetic_testing
    group: measurement
    label: Genetic testing
    definition: >
      Variant testing relevant to POTS and its comorbidities: noradrenaline
      transporter (SLC6A2), mast-cell and tryptase loci, and connective-tissue
      genes.
    pubmed_query: '"genetic"[tiab] OR genotyp*[tiab] OR polymorphism*[tiab] OR variant*[tiab] OR SLC6A2[tiab] OR TPSAB1[tiab] OR "whole exome"[tiab] OR "genome-wide"[tiab] OR heritab*[tiab] OR familial[tiab]'
    mesh_terms: ['Genetic Testing', 'Polymorphism, Single Nucleotide', 'Genetic Predisposition to Disease', 'Exome Sequencing']
    concepts:
      - {vocabulary: SNOMED, search_term: 'genetic test'}
    source_refs: [low2009]


  - id: urine_sodium_24h
    group: measurement
    label: 24-hour urine sodium
    definition: >
      Sodium excreted over 24 hours, a proxy for salt intake and volume status;
      below 100 mmol/24 h marks the hypovolemic phenotype in Angeli 2024.
    pubmed_query: '"urine sodium"[tiab] OR "urinary sodium"[tiab] OR "sodium excretion"[tiab] OR "24-hour urine"[tiab] OR "24-h urine"[tiab]'
    mesh_terms: ['Natriuresis', 'Sodium, Dietary']
    concepts:
      - {vocabulary: LOINC, search_term: 'sodium 24 hour urine'}
    source_refs: [angeli2024, low2009]
  - id: renin_aldosterone_assay
    group: measurement
    label: Plasma renin and aldosterone
    definition: >
      Plasma renin activity and aldosterone, inappropriately low for the degree
      of hypovolaemia in some patients (the renin-angiotensin-aldosterone paradox).
    pubmed_query: '"plasma renin"[tiab] OR "renin activity"[tiab] OR aldosterone[tiab] OR "renin-angiotensin"[tiab]'
    mesh_terms: ['Renin', 'Aldosterone', 'Renin-Angiotensin System']
    concepts:
      - {vocabulary: LOINC, search_term: 'renin activity plasma'}
      - {vocabulary: LOINC, search_term: 'aldosterone serum'}
    source_refs: [chung2026]
  - id: regional_norepinephrine_spillover
    group: measurement
    label: Regional norepinephrine spillover
    definition: >
      Research measurement of noradrenaline released into the venous drainage
      of a limb; reduced in the legs in neuropathic POTS.
    pubmed_query: '"norepinephrine spillover"[tiab] OR "noradrenaline spillover"[tiab] OR "norepinephrine release"[tiab]'
    mesh_terms: ['Norepinephrine']
    concepts:
      - {vocabulary: LOINC, search_term: 'norepinephrine plasma'}
    source_refs: [chung2026, low2009]
  - id: muscle_sympathetic_nerve_activity
    group: measurement
    label: Muscle sympathetic nerve activity (microneurography)
    definition: >
      Direct recording of sympathetic outflow to muscle; blunted in the legs of
      a subset of patients, supporting patchy sympathetic denervation.
    pubmed_query: '"muscle sympathetic nerve activity"[tiab] OR MSNA[tiab] OR microneurography[tiab]'
    mesh_terms: ['Sympathetic Nervous System']
    concepts:
      - {vocabulary: SNOMED, search_term: 'autonomic nervous system function'}
    source_refs: [chung2026]
  - id: cardiac_mri
    group: measurement
    label: Cardiac MRI (left ventricular mass)
    definition: >
      Cardiac magnetic resonance imaging; a smaller left ventricular mass in POTS
      is taken as evidence of cardiac deconditioning.
    pubmed_query: '"cardiac magnetic resonance"[tiab] OR "cardiac MRI"[tiab] OR "left ventricular mass"[tiab] OR "cardiac mass"[tiab]'
    mesh_terms: ['Magnetic Resonance Imaging, Cine', 'Heart Ventricles']
    concepts:
      - {vocabulary: SNOMED, search_term: 'magnetic resonance imaging of heart'}
    source_refs: [chung2026]
  - id: quantitative_sensory_testing
    group: measurement
    label: Quantitative sensory testing
    definition: >
      Thermal and vibration threshold testing of small and large sensory
      fibres; one of the three criteria for neuropathic POTS in Gibbons 2013.
    pubmed_query: '"quantitative sensory testing"[tiab] OR "thermal threshold"[tiab] OR "thermal thresholds"[tiab] OR "cold detection"[tiab] OR "heat pain threshold"[tiab]'
    mesh_terms: ['Sensory Thresholds', 'Thermosensing']
    concepts:
      - {vocabulary: SNOMED, search_term: 'quantitative sensory testing'}
    source_refs: [gibbons2013]
  - id: end_tidal_co2
    group: measurement
    label: End-tidal CO2 on tilt
    definition: >
      Capnography during orthostatic challenge; low end-tidal CO2 at end-tilt
      shows orthostatic hypocapnia.
    pubmed_query: '"end-tidal CO2"[tiab] OR "end-tidal carbon dioxide"[tiab] OR ETCO2[tiab] OR capnography[tiab] OR hypocapnia[tiab]'
    mesh_terms: ['Capnography', 'Hypocapnia']
    concepts:
      - {vocabulary: LOINC, search_term: 'carbon dioxide end tidal'}
    source_refs: [larsen2025]

