      different observations with different reliability.
    pubmed_query: '"small fiber neuropathy"[tiab] OR "small fibre neuropathy"[tiab] OR SFN[tiab] OR "sensory neuropathy"[tiab] OR "painful neuropathy"[tiab] OR "burning feet"[tiab] OR allodynia[tiab]'
    mesh_terms: ['Small Fiber Neuropathy', 'Peripheral Nervous System Diseases']
