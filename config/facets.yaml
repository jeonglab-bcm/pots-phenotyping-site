      - {vocabulary: SNOMED, search_term: 'chronic lung disease'}
    source_refs: [chung2026, angeli2024]
  - id: medication_induced_tachycardia
    group: comorbidity
    label: Medication-induced tachycardia (rule out)
    definition: >
      Tachycardia caused or worsened by drugs: stimulants, sympathomimetics,
      norepinephrine reuptake inhibitors, SNRIs, diuretics, alpha-1 blockers,
      vasodilators and anticholinergics.
    pubmed_query: '"drug-induced"[tiab] OR "medication-induced"[tiab] OR stimulant*[tiab] OR atomoxetine[tiab] OR amphetamine*[tiab] OR methylphenidate[tiab] OR diuretic*[tiab]'
    mesh_terms: ['Central Nervous System Stimulants', 'Diuretics', 'Adrenergic alpha-1 Receptor Antagonists']
    concepts:
      - {vocabulary: SNOMED, search_term: 'adverse reaction to drug'}
      - {vocabulary: SNOMED, search_term: 'sinus tachycardia'}
    source_refs: [lau2026, chung2026]
  - id: anxiety_depression
    group: comorbidity
    label: Anxiety and depression
    definition: >
