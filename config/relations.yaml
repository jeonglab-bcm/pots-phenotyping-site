# Ontology over the POTS phenotyping vocabulary.
#
# POTS is the root of the evidence graph: every literature link points toward
# it (test -> cause, treatment -> cause, cause -> POTS, condition -> POTS). The
# questions those links answer are in docs/COMPETENCY_QUESTIONS.md.
#
# Two kinds of edge live here:
#
#   1. Taxonomy (`is_a`, provenance 'taxonomy'): what kind of thing each topic
#      is, for mapping to OMOP domains. Hand-maintained below. Structure, not a
#      literature claim.
#
#   2. Literature links (every other predicate): generated from the quoted
#      claims in config/relation_excerpts.yaml by scripts/build_relations.py.
#      Do not edit that block by hand; add or change a claim and regenerate.
#      Provenance names the seed papers whose passages back the link.
#
# The resolved OMOP graph built by `pots-phenotyping ontology` is kept apart in
# its own tables and never merged into these edges.
#
# Predicates. Only is_a is subsumption; part_of is transitive but not is_a. The
# rest are domain relations and must not be traversed as if they were is_a.
#
#   is_a                      - what kind of thing a topic is. Transitive.
#   part_of                   - component of a composite test or battery.
#   evidence_for              - a test supplies objective evidence for a cause,
#                               for POTS, or for a linked condition.
#   indicates                 - prescribing a treatment is weak evidence that a
#                               clinician suspected that cause or condition.
#   treats                    - therapeutic target.
#   measures                  - the physiological quantity a test quantifies.
#   associated_with           - co-occurrence, no causal claim.
#   proposed_mechanism_of     - a cause proposed to produce POTS, or a condition
#                               proposed to produce a cause.
#   trigger_of                - exposure or event preceding onset.
#   differential_diagnosis_of - must be excluded before the diagnosis stands.

predicates:
  is_a:                      {transitive: true,  subsumption: true,  inverse: subsumes}
  part_of:                   {transitive: true,  subsumption: false, inverse: has_part}
  evidence_for:              {transitive: false, subsumption: false, inverse: assessed_by}
  indicates:                 {transitive: false, subsumption: false, inverse: indicated_by}
  treats:                    {transitive: false, subsumption: false, inverse: treated_by}
  measures:                  {transitive: false, subsumption: false, inverse: measured_by}
  associated_with:           {transitive: false, subsumption: false, inverse: associated_with, symmetric: true}
  proposed_mechanism_of:     {transitive: false, subsumption: false, inverse: has_proposed_mechanism}
  trigger_of:                {transitive: false, subsumption: false, inverse: triggered_by}
  differential_diagnosis_of: {transitive: false, subsumption: false, inverse: has_differential_diagnosis}

