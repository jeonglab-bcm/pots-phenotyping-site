# Supporting excerpts for the curated relations in relations.yaml.
#
# For every edge that cites a seed paper, this file records what the cited
# paper actually says: a verbatim quote, where it appears, and a verdict on
# whether it backs the edge. It is an audit layer over relations.yaml and does
# not change the graph.
#
# Sources searched (fetched 2026-10-01):
#   low2009, gibbons2013, zhang2022, angeli2024  full text, PMC open-access BioC
#                                                (PMC3904426, PMC3874039,
#                                                PMC9629858, PMC10761725)
#   larsen2025                                   abstract only (medRxiv API,
#                                                10.1101/2025.04.28.25326587);
#                                                the full text was not reachable
#
# Verdicts:
#   supports     the quote states the claim
#   partial      related, but narrower, indirect or about a neighbouring claim
#   not_found    the cited source was searched and says nothing that backs it
#   contradicts  the source says the opposite
#
# `cited: false` marks a quote from a seed paper the edge does NOT cite, kept
# because it backs (or is the better source for) the claim.
#
# Quotes were selected and verdicts assigned by Claude (an AI assistant) and
# have not been reviewed by a clinician. Every quote is a verbatim substring of
# its source, whitespace-normalised; table cells are quoted as printed.
#
# `removed` lists the edges deleted from relations.yaml on 2026-10-01 because no
# seed paper supports them or their source contradicts them; kept for audit.

