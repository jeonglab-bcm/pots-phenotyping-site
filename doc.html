<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POTS Docs</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
:root { color-scheme: light; --page: #f9f9f7; --surface: #ffffff; --ink: #0b0b0b; --ink-2: #52514e; --line: #e1e0d9; --accent: #2a78d6; }
@media (prefers-color-scheme: dark) { :root { color-scheme: dark; --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff;
  --ink-2: #c3c2b7; --line: #2c2c2a; --accent: #3987e5; } }
body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; }
a { color: var(--accent); }
article { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px 24px; overflow-x: auto; }
table { border-collapse: collapse; font-size: 14px; margin: 10px 0; }
th, td { border-bottom: 1px solid var(--line); padding: 5px 9px; text-align: left; vertical-align: top; }
code { font-size: 13px; } pre { overflow-x: auto; background: var(--page); padding: 10px; border-radius: 8px; }
</style>
</head>
<body><main>
<p><a href="./">&larr; POTS deep phenotyping</a></p>
<article id="doc">Loading&hellip;</article>
</main>
<script>
const f = new URLSearchParams(location.search).get("f") || "";
const doc = document.getElementById("doc");
if (!/^[A-Za-z0-9_\/.-]+\.md$/.test(f) || f.includes("..")) { doc.textContent = "Unknown document."; }
else fetch(f).then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(t => { doc.innerHTML = marked.parse(t); document.title = (doc.querySelector("h1") || {}).textContent || "POTS Docs"; })
  .catch(() => { doc.textContent = "Could not load " + f + "."; });
</script>
</body>
</html>
